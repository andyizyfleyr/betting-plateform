name: Deploy PartyServer Realtime (Cloudflare Workers)

on:
  push:
    branches:
      - main
    paths:
      - "party/**"
      - "wrangler.jsonc"
      - ".github/workflows/partykit-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-partyserver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Deploy PartyServer Worker (when CLOUDFLARE_API_TOKEN is configured)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PARTYKIT_SECRET: ${{ secrets.PARTYKIT_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://be-plateform.vercel.app' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Secret CLOUDFLARE_API_TOKEN non configuré — étape ignorée proprement."
            exit 0
          fi
          if [ -n "$PARTYKIT_SECRET" ]; then
            printf '{"PARTYKIT_SECRET":"%s"}' "$PARTYKIT_SECRET" > .wrangler-secrets.tmp.json
            npx wrangler deploy -c wrangler.jsonc --autoconfig=false --var "APP_URL:$APP_URL" --secrets-file .wrangler-secrets.tmp.json
            rm -f .wrangler-secrets.tmp.json
          else
            npx wrangler deploy -c wrangler.jsonc --autoconfig=false --var "APP_URL:$APP_URL"
          fi
