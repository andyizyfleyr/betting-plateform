name: Synchronisation automatique des matchs (Cron)

on:
  schedule:
    # 2 passages légers le matin à 06h00 et 09h00 UTC (07h00 et 10h00 heure de Porto-Novo / Paris)
    - cron: "0 6,9 * * *"
    # Toutes les 20 min de 11h00 à 23h40 UTC (12h00 à 00h40 locale)
    - cron: "*/20 11-23 * * *"
    # Passage final à 00h15 UTC (01h15 locale) pour clôturer les fins de soirée / LDC
    - cron: "15 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cron-sync.yml"
      - "src/app/api/cron/tick/route.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution (light = rapide & économe Neon, full = complet avec ML)"
        required: false
        default: "light"
        type: choice
        options:
          - light
          - full

permissions:
  contents: read
  deployments: read

concurrency:
  group: cron-platform-sync
  cancel-in-progress: false

jobs:
  sync-matches:
    name: Tick léger /api/cron/tick
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CONFIGURED_APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
      CRON_MODE: ${{ inputs.mode || 'light' }}
    steps:
      - name: Synchroniser les matchs et régler les paris échus
        run: |
          set -euo pipefail

          CANDIDATES=()
          if [ -n "${CONFIGURED_APP_URL:-}" ]; then
            CANDIDATES+=("${CONFIGURED_APP_URL%/}")
          fi

          CANDIDATES+=(
            "https://be-plateform.vercel.app"
            "https://be-plateform-matias-projects-9014d3d4.vercel.app"
            "https://betting-plateform.vercel.app"
          )

          STATUSES_URL="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=1" --jq '.[0].statuses_url // empty' 2>/dev/null || true)"
          if [ -n "${STATUSES_URL:-}" ]; then
            DEP_URL="$(gh api "$STATUSES_URL" --jq '.[0].environment_url // empty' 2>/dev/null || true)"
            if [ -n "${DEP_URL:-}" ]; then
              CANDIDATES+=("${DEP_URL%/}")
            fi
          fi

          AUTH_ARGS=()
          if [ -n "${CRON_SECRET:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          LAST_HTTP="000"
          LAST_BODY=""

          for BASE in "${CANDIDATES[@]}"; do
            [ -z "$BASE" ] && continue
            TARGET="${BASE}/api/cron/tick"
            echo "→ Appel ${TARGET} (mode=${CRON_MODE})"

            RESP_FILE="$(mktemp)"
            HTTP_CODE="$(curl -sS --max-redirs 3 -L --max-time 55 \
              -o "$RESP_FILE" \
              -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "X-Cron-Mode: ${CRON_MODE}" \
              -H "User-Agent: PulseBet-GitHub-Cron/1.0" \
              ${AUTH_ARGS[@]+"${AUTH_ARGS[@]}"} \
              "$TARGET" || echo "000")"

            BODY="$(cat "$RESP_FILE" 2>/dev/null || true)"
            rm -f "$RESP_FILE"

            LAST_HTTP="$HTTP_CODE"
            LAST_BODY="$BODY"

            if [ "$HTTP_CODE" = "200" ] && printf '%s' "$BODY" | jq -e '.ok == true' >/dev/null 2>&1; then
              echo "✓ Synchronisation réussie (HTTP 200 JSON valide) sur ${BASE} :"
              printf '%s\n' "$BODY"
              exit 0
            fi

            echo "  Réponse non retenue (HTTP ${HTTP_CODE}) sur ${BASE}, essai suivant..."
          done

          echo "✗ Échec de la synchronisation Cron (dernier code HTTP : ${LAST_HTTP})"
          printf '%s\n' "${LAST_BODY}" | head -c 500
          echo ""
          if [ "$LAST_HTTP" = "401" ]; then
            echo "::error::CRON_SECRET est actif sur Vercel : ajoutez la même valeur dans GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret -> CRON_SECRET."
          fi
          exit 1
