name: Synchronisation des matchs
on:
  schedule:
    # 25 min exact : cron ne peut pas exprimer « toutes les 25 min » sur une
    # seule ligne (60 n'est pas divisible par 25). On décrit donc un cycle
    # de 5 h = 12 déclenchements espacés de 25 min, qui se répète.
    # (`*/25` donnerait 25, 25 puis 10 min → 20 min en moyenne.)
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '25 0,5,10,15,20 * * *'
    - cron: '50 0,5,10,15,20 * * *'
    - cron: '15 1,6,11,16,21 * * *'
    - cron: '40 1,6,11,16,21 * * *'
    - cron: '5 2,7,12,17,22 * * *'
    - cron: '30 2,7,12,17,22 * * *'
    - cron: '55 2,7,12,17,22 * * *'
    - cron: '20 3,8,13,18,23 * * *'
    - cron: '45 3,8,13,18,23 * * *'
    - cron: '10 4,9,14,19 * * *'
    - cron: '35 4,9,14,19 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: virtual-heartbeat
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Déclencher le moteur en mode léger
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          args=()
          if [ -n "$CRON_SECRET" ]; then
            args=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          curl --fail --silent --show-error --retry 2 --max-time 70 "${args[@]}" 'https://be-plateform.vercel.app/api/cron/tick?mode=light'
