workflows:
  pulse-bet-android-apk:
    name: Pulse Bet Android APK (React Native Hermes)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 22
      java: 17
      vars:
        EXPO_PUBLIC_API_URL: "https://be-plateform.vercel.app"
        EXPO_NO_TELEMETRY: "1"
        CI: "1"
    scripts:
      - name: Installation des dépendances React Native (mobile/)
        script: |
          cd mobile
          npm ci --no-audit --no-fund
      - name: Génération du projet Android natif (Expo SDK 52 Prebuild)
        script: |
          cd mobile
          npx expo prebuild --platform android --no-install
      - name: Compilation de l'APK Release React Native + Hermes (ARM compressé)
        script: |
          cd mobile/android
          printf "\norg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\norg.gradle.parallel=true\n" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pexpo.useLegacyPackaging=true \
            --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$CM_BUILD_DIR/Pulse-Bet-ReactNative.apk"
          ls -lh "$CM_BUILD_DIR/Pulse-Bet-ReactNative.apk"
    artifacts:
      - Pulse-Bet-ReactNative.apk
